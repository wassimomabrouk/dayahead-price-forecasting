name: daily forecast

# Attempts spread widely, at odd minutes, all before the noon auction that
# fixes tomorrow's prices.
#
# Three constraints, and the third only became visible once the job was
# actually running.
#
# Too early and the day-ahead load forecast may not exist yet; its regulatory
# deadline is two hours before gate closure, so 10:00 local. Too late and the
# auction has already fixed the prices. And in between, GitHub's scheduler
# does not run when asked: on 15 September crons set for 10:00, 11:00 and
# 11:30 Berlin fired at roughly 14:58, 16:36 and 16:44, three to five hours
# behind, by which time every attempt was past the auction and the day was
# lost.
#
# Two things reduce that. Odd minutes rather than the top of the hour, since
# on-the-hour schedules queue behind everyone else's. And a wider spread, so
# a delayed early attempt lands where a punctual late one would have.
#
#   04:23 UTC  ->  06:23 Berlin summer, 05:23 winter
#   05:47 UTC  ->  07:47 summer, 06:47 winter
#   07:13 UTC  ->  09:13 summer, 08:13 winter
#   08:37 UTC  ->  10:37 summer, 09:37 winter
#   09:19 UTC  ->  11:19 summer, 10:19 winter
#
# The first two are almost certainly too early for the load forecast and will
# exit in seconds having found nothing. They are here as drift cover: an
# attempt scheduled for 06:23 and delayed three hours still lands inside the
# window, whereas one scheduled for 11:19 and delayed three hours does not.
#
# Attempts cost seconds once the day is covered, so the only real cost of
# five is a longer Actions list.
on:
  schedule:
    - cron: "23 4 * * *"
    - cron: "47 5 * * *"
    - cron: "13 7 * * *"
    - cron: "37 8 * * *"
    - cron: "19 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    # A single fit of the champion plus the data pull. The generous limit is
    # so a slow SMARD response does not abandon a run that would have worked.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The raw SMARD store is gitignored and reproducible, but a cold start
      # is roughly 3,700 requests and twenty minutes. Caching it turns the
      # daily run into a two block refresh. The key rolls weekly so the cache
      # tracks the store's growth rather than pinning it to one snapshot.
      - name: Cache the raw store
        uses: actions/cache@v4
        with:
          path: data/raw
          key: smard-raw-${{ github.run_id }}
          restore-keys: |
            smard-raw-

      - name: Install
        # No editable install: the project runs from the repository root with
        # no installation step, so CI installs the dependencies directly.
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow statsmodels lightgbm scikit-learn neuralforecast

      - name: Ingest
        run: python -m dayahead.cli ingest

      - name: Validate
        run: python -m dayahead.cli validate

      - name: Forecast
        run: python -W ignore -m dayahead.cli forecast

      - name: Publish page
        run: python -m dayahead.cli page

      - name: Commit the track record
        # The forecast log and the page are the only things this job writes.
        # The raw store stays out of git; it is reproducible from ingest.
        run: |
          git config user.name "daily-forecast"
          git config user.email "actions@github.com"
          git add reports/forecast_log.csv reports/track_record.json docs/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Daily forecast $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report failure without breaking the record
        if: failure()
        # A failed run leaves the previous forecast and page in place rather
        # than replacing them with an error state. The gap is visible in the
        # log, which is the honest outcome.
        run: echo "Run failed. Previous forecast and page remain published."
