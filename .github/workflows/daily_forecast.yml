name: daily forecast

# Four attempts a day, all before the noon auction that fixes tomorrow's
# prices.
#
# Two risks pull in opposite directions. Run too early and the day-ahead load
# forecast may not be published yet, whose regulatory deadline is two hours
# before gate closure, so 10:00 local. Run too late and GitHub's scheduler,
# which queues jobs and routinely starts them 20 to 60 minutes behind, can
# push the attempt past the auction. On 14 September the 09:00 UTC run had
# not fired by 11:36 Berlin and the day had to be triggered by hand.
#
# Spreading the attempts solves both. Local times by season:
#
#   08:00 UTC  ->  10:00 Berlin summer, 09:00 winter
#   09:00 UTC  ->  11:00 summer, 10:00 winter
#   09:30 UTC  ->  11:30 summer, 10:30 winter
#
# The earliest attempt may find no load forecast and exit; the later ones
# catch it. Any one succeeding is enough, and the last has half an hour of
# margin against the auction in summer, ninety minutes in winter.
#
# A fourth attempt at 07:00 UTC was considered and dropped. It falls outside
# the guaranteed publication window in both seasons, so its only value is as
# cover for scheduler drift, and three attempts already provide that.
#
# Extra attempts are nearly free. The forecast command checks the log before
# fitting and exits in seconds when the day is already covered, so only the
# first successful attempt of the day does real work.
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    # A single fit of the champion plus the data pull. The generous limit is
    # so a slow SMARD response does not abandon a run that would have worked.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The raw SMARD store is gitignored and reproducible, but a cold start
      # is roughly 3,700 requests and twenty minutes. Caching it turns the
      # daily run into a two block refresh. The key rolls weekly so the cache
      # tracks the store's growth rather than pinning it to one snapshot.
      - name: Cache the raw store
        uses: actions/cache@v4
        with:
          path: data/raw
          key: smard-raw-${{ github.run_id }}
          restore-keys: |
            smard-raw-

      - name: Install
        # No editable install: the project runs from the repository root with
        # no installation step, so CI installs the dependencies directly.
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow statsmodels lightgbm scikit-learn neuralforecast

      - name: Ingest
        run: python -m dayahead.cli ingest

      - name: Validate
        run: python -m dayahead.cli validate

      - name: Forecast
        run: python -W ignore -m dayahead.cli forecast

      - name: Publish page
        run: python -m dayahead.cli page

      - name: Commit the track record
        # The forecast log and the page are the only things this job writes.
        # The raw store stays out of git; it is reproducible from ingest.
        run: |
          git config user.name "daily-forecast"
          git config user.email "actions@github.com"
          git add reports/forecast_log.csv reports/track_record.json docs/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Daily forecast $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report failure without breaking the record
        if: failure()
        # A failed run leaves the previous forecast and page in place rather
        # than replacing them with an error state. The gap is visible in the
        # log, which is the honest outcome.
        run: echo "Run failed. Previous forecast and page remain published."
