name: daily forecast

# Two runs a day, half an hour apart, both before the noon auction that fixes
# tomorrow's prices.
#
# Cron is UTC and Berlin moves, so the local times differ by season:
#
#   09:00 UTC  ->  11:00 Berlin in summer, 10:00 in winter
#   09:30 UTC  ->  11:30 Berlin in summer, 10:30 in winter
#
# Both land before midday either way, and both fall after the regulatory
# deadline for the day-ahead load forecast, which is two hours before gate
# closure. An earlier pair would give more margin against the auction and
# risk running before the load forecast exists, which is the wrong trade:
# the input has to be there before the run is worth making.
#
# The second run is nearly free when the first succeeded. The forecast
# command checks the log before fitting and exits at once if the day is
# already covered, so it only does real work when the earlier run found no
# load forecast or failed outright.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    # A single fit of the champion plus the data pull. The generous limit is
    # so a slow SMARD response does not abandon a run that would have worked.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The raw SMARD store is gitignored and reproducible, but a cold start
      # is roughly 3,700 requests and twenty minutes. Caching it turns the
      # daily run into a two block refresh. The key rolls weekly so the cache
      # tracks the store's growth rather than pinning it to one snapshot.
      - name: Cache the raw store
        uses: actions/cache@v4
        with:
          path: data/raw
          key: smard-raw-${{ github.run_id }}
          restore-keys: |
            smard-raw-

      - name: Install
        # No editable install: the project runs from the repository root with
        # no installation step, so CI installs the dependencies directly.
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow statsmodels lightgbm scikit-learn neuralforecast

      - name: Ingest
        run: python -m dayahead.cli ingest

      - name: Validate
        run: python -m dayahead.cli validate

      - name: Forecast
        run: python -W ignore -m dayahead.cli forecast

      - name: Publish page
        run: python -m dayahead.cli page

      - name: Commit the track record
        # The forecast log and the page are the only things this job writes.
        # The raw store stays out of git; it is reproducible from ingest.
        run: |
          git config user.name "daily-forecast"
          git config user.email "actions@github.com"
          git add reports/forecast_log.csv reports/track_record.json docs/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Daily forecast $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report failure without breaking the record
        if: failure()
        # A failed run leaves the previous forecast and page in place rather
        # than replacing them with an error state. The gap is visible in the
        # log, which is the honest outcome.
        run: echo "Run failed. Previous forecast and page remain published."
