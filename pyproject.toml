[project]
name = "dayahead-price-forecasting"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for the German/Luxembourg bidding zone under a strict gate-closure information constraint."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
models = [
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "holidays>=0.45",
]
dev = ["pytest>=8.0", "matplotlib>=3.8", "jupyter"]

# Without this, setuptools refuses to build: it finds data, reports,
# notebooks and dayahead at the top level and will not guess which is the
# package. The project runs without installation, so this never surfaced
# locally; it surfaced the first time CI tried to install it.
[tool.setuptools.packages.find]
include = ["dayahead*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
